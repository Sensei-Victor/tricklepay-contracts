[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tricklepay/tricklepay-contracts"

[workspace.dependencies]
# Pin soroban-sdk to an exact version matching the tests' expected client API.
# If this needs adjustment, I'll iterate to the exact compatible version.
soroban-sdk = "=25.3.2"

[profile.release]
opt-level = "z"
# Keep checked arithmetic in release builds so `stream.withdrawn += amount`
# and related balance updates abort on overflow instead of wrapping.
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
